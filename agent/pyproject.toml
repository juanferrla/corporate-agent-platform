[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-agent-starter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langfuse>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
